<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peetty figure sheet</title>
  <style>
    :root { color-scheme: light; --bg: #f5f4fb; --card: #fff; --ink: #2b2840; --muted: #77738f; --line: #e4e1f0; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #17161f; --card: #22202d; --ink: #eeeaf8; --muted: #a29db8; --line: #34314a; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; gap: 16px; align-items: center; padding: 16px 24px; }
    h1 { font-size: 18px; margin: 0; }
    header button { margin-left: auto; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 20px; padding: 0 24px 32px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .card h2 { margin: 0; font-size: 16px; }
    .card p { margin: 2px 0 10px; color: var(--muted); min-height: 3em; }
    .stage { display: grid; place-items: end center; border-bottom: 3px solid var(--line); margin-bottom: 40px; height: calc(130px * var(--scale, 2.5) + 20px); border-radius: 12px; background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--line) 70%, transparent), transparent 70%); }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
    button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
    .actual { display: flex; padding-top: 70px; align-items: flex-end; gap: 16px; margin-top: 14px; border-top: 1px solid var(--line); color: var(--muted); }
    .mini-card { flex: 1; position: relative; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
    .mini-card .perch { position: absolute; left: 18px; bottom: calc(100% - 1px); }
    .error { color: #c0392b; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
  </style>
</head>
<body>
  <header><h1>Peetty figure sheet</h1><span id="status"></span><button id="theme" type="button">Toggle dark</button></header>
  <main id="sheet"></main>
  <script type="module">
    import { FigureView, STATES } from '/dist/index.js';
    const query = new URLSearchParams(location.search);
    const ids = query.get('figures')?.split(',') ?? ['miru', 'koharu', 'xiaoxiao', 'riley', 'amara', 'elsie', 'shiori'];
    const scale = Number(query.get('scale') ?? 2.5);
    const moods = ['neutral', 'happy', 'worried'];
    const sheet = document.getElementById('sheet');
    document.getElementById('theme').onclick = () => {
      const root = document.documentElement;
      root.dataset.theme = root.dataset.theme === 'dark' ? '' : 'dark';
    };
    window.views = {};

    for (const id of ids) {
      const card = document.createElement('section');
      card.className = 'card';
      card.dataset.figure = id;
      sheet.append(card);
      card.style.setProperty('--scale', scale);
      try {
        // Kit-built figures load from their source; contributed JSON loads as is.
        const figure = await import(`/figures/src/${id}.mjs?${Date.now()}`).then((m) => m.default)
          .catch(() => fetch(`/figures/${id}.json?${Date.now()}`).then((r) => { if (!r.ok) throw new Error(`No figure "${id}"`); return r.json(); }));
        const big = new FigureView(figure, { scale });
        const small = new FigureView(figure, { scale: 1 });
        window.views[id] = big;
        card.innerHTML = `<h2></h2><p></p><div class="stage"></div>
          <div class="controls" data-kind="state"></div><div class="controls" data-kind="mood"></div>
          <div class="actual"><span>Actual size</span><div class="mini-card"></div></div>`;
        const names = typeof figure.name === 'string' ? [figure.name] : [figure.name.en, figure.name.zh].filter(Boolean);
        card.querySelector('h2').textContent = names.join(' · ') || big.name;
        card.querySelector('p').textContent = typeof figure.description === 'string' ? figure.description : figure.description?.en ?? '';
        card.querySelector('.stage').append(big.element);
        const perch = document.createElement('div');
        perch.className = 'perch';
        perch.append(small.element);
        card.querySelector('.mini-card').append(perch);
        const group = (kind, list, apply) => {
          const box = card.querySelector(`[data-kind="${kind}"]`);
          for (const value of list) {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = value;
            b.dataset.value = value;
            b.setAttribute('aria-pressed', String(value === list[0]));
            b.onclick = () => {
              for (const other of box.children) other.setAttribute('aria-pressed', String(other === b));
              apply(value);
            };
            box.append(b);
          }
        };
        group('state', STATES, (s) => { big.play(s); small.play(s); });
        group('mood', moods, (m) => { big.setMood(m); small.setMood(m); });
      } catch (error) {
        const heading = document.createElement('h2');
        heading.textContent = id;
        const message = document.createElement('p');
        message.className = 'error';
        message.textContent = String(error?.message ?? error);
        card.replaceChildren(heading, message);
      }
    }
    document.getElementById('status').textContent = `${Object.keys(window.views).length} figure(s)`;
  </script>
</body>
</html>
